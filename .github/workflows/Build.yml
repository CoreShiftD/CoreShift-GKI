name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-legacy
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.ack_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ack_branch:
          - android11-5.4-lts
          - android12-5.4-lts
          - android12-5.10-lts
          - android13-5.10-lts
          - android13-5.15-lts
          - android14-5.15-lts

    steps:
      - name: Disable IPv6
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Checkout ACK control files
        uses: actions/checkout@v4
        with:
          repository: CoreShiftD/android_kernel_common_lts
          ref: main
          path: ack-control
          fetch-depth: 1
          sparse-checkout: |
            build.sh
            scripts
            configs
          sparse-checkout-cone-mode: true

      - name: Read ACK profile
        id: profile
        shell: bash
        env:
          ACK_BRANCH: ${{ matrix.ack_branch }}
        run: |
          set -euo pipefail

          profile="ack-control/configs/profiles/${ACK_BRANCH}.json"

          python3 - "${profile}" "${ACK_BRANCH}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          selected = sys.argv[2]

          with open(path, "r", encoding="utf-8") as f:
              p = json.load(f)

          if p.get("branch") != selected:
              raise SystemExit("profile branch mismatch")

          if p.get("enabled", True) is False:
              raise SystemExit(f"profile disabled: {selected}")

          if p.get("backend") != "google_build_sh":
              raise SystemExit(f"unsupported backend: {p.get('backend')}")

          clang = p.get("clang", "")
          if not isinstance(clang, str) or not clang.startswith("clang-r"):
              raise SystemExit(f"invalid clang: {clang!r}")

          fields = {
              "profile_branch": p.get("branch", ""),
              "kernel_version": p.get("kernel_version", ""),
              "android_release": p.get("android_release", ""),
              "backend": p.get("backend", ""),
              "clang": clang,
              "kernel_build_path": p.get("kernel_build_path", ""),
              "kernel_build_ref": p.get("kernel_build_ref", ""),
              "lto": p.get("lto", ""),
          }

          for k, v in fields.items():
              print(f"{k}={'' if v is None else v}")
          PY

      - name: Checkout selected ACK cache
        shell: bash
        env:
          KERNEL_BUILD_PATH: ${{ steps.profile.outputs.kernel_build_path }}
        run: |
          set -euo pipefail

          git -C ack-control sparse-checkout set \
            build.sh \
            scripts \
            configs \
            "${KERNEL_BUILD_PATH}" \
            external/prebuilts/build-tools

          test -d "ack-control/${KERNEL_BUILD_PATH}" || {
            echo "Missing ${KERNEL_BUILD_PATH}. Run setup-cache.yml first." >&2
            exit 1
          }

          test -d "ack-control/external/prebuilts/build-tools" || {
            echo "Missing external/prebuilts/build-tools. Run setup-cache.yml first." >&2
            exit 1
          }

      - name: Install minimal host deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            flex \
            libc6-dev \
            libelf-dev \
            rsync \
            zstd
          sudo rm -rf /var/lib/apt/lists/*

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: CoreShiftD/android_kernel_common_lts
          ref: ${{ steps.profile.outputs.profile_branch }}
          path: kernel/common
          fetch-depth: 1
          submodules: false

      - name: Download Clang
        id: clang
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CLANG: ${{ steps.profile.outputs.clang }}
        run: |
          set -euo pipefail

          rm -rf toolchains
          mkdir -p toolchains

          pattern="${CLANG}-linux-x86-*.tar.zst"

          gh release download aosp-clang-toolchains \
            --repo CoreShiftD/android_kernel_common_lts \
            --pattern "${pattern}" \
            --dir toolchains

          archive="$(find toolchains -maxdepth 1 -type f -name "${pattern}" -print -quit)"

          test -n "${archive}" || {
            echo "Missing Clang archive: ${pattern}" >&2
            exit 1
          }

          sha256sum "${archive}" > clang-archive.sha256
          tar --zstd -xf "${archive}" -C toolchains
          rm -f "${archive}"

          clang_dir="${GITHUB_WORKSPACE}/toolchains/${CLANG}"
          test -x "${clang_dir}/bin/clang"

          {
            echo "dir=${clang_dir}"
            echo "sha256=$(awk '{print $1}' clang-archive.sha256)"
          } >> "${GITHUB_OUTPUT}"

          "${clang_dir}/bin/clang" --version | head -n 1

      - name: Add 16GB swap
        shell: bash
        run: |
          set -euo pipefail

          swapfile="/mnt/swapfile"
          sudo swapoff "${swapfile}" 2>/dev/null || true
          sudo rm -f "${swapfile}"
          sudo fallocate -l 16G "${swapfile}" || sudo dd if=/dev/zero of="${swapfile}" bs=1M count=16384 status=progress
          sudo chmod 600 "${swapfile}"
          sudo mkswap "${swapfile}"
          sudo swapon "${swapfile}"

      - name: Build kernel
        shell: bash
        env:
          ACK_BRANCH: ${{ matrix.ack_branch }}
          CLANG_DIR: ${{ steps.clang.outputs.dir }}
          DISABLE_DEFCONFIG_CHECK: "1"
        run: |
          set -euo pipefail

          ack-control/build.sh \
            "${ACK_BRANCH}" \
            "${GITHUB_WORKSPACE}/kernel/common" \
            "${CLANG_DIR}"

      - name: Write build info
        shell: bash
        env:
          ACK_BRANCH: ${{ matrix.ack_branch }}
          PROFILE_BRANCH: ${{ steps.profile.outputs.profile_branch }}
          KERNEL_VERSION: ${{ steps.profile.outputs.kernel_version }}
          ANDROID_RELEASE: ${{ steps.profile.outputs.android_release }}
          BACKEND: ${{ steps.profile.outputs.backend }}
          KERNEL_BUILD_PATH: ${{ steps.profile.outputs.kernel_build_path }}
          KERNEL_BUILD_REF: ${{ steps.profile.outputs.kernel_build_ref }}
          CLANG: ${{ steps.profile.outputs.clang }}
          CLANG_ARCHIVE_SHA256: ${{ steps.clang.outputs.sha256 }}
          LTO: ${{ steps.profile.outputs.lto }}
        run: |
          set -euo pipefail

          {
            echo "ack_branch=${ACK_BRANCH}"
            echo "profile_branch=${PROFILE_BRANCH}"
            echo "kernel_version=${KERNEL_VERSION}"
            echo "android_release=${ANDROID_RELEASE}"
            echo "backend=${BACKEND}"
            echo "kernel_build_path=${KERNEL_BUILD_PATH}"
            echo "kernel_build_ref=${KERNEL_BUILD_REF}"
            echo "kernel_source_commit=$(git -C kernel/common rev-parse HEAD)"
            echo "clang=${CLANG}"
            echo "clang_archive_sha256=${CLANG_ARCHIVE_SHA256}"
            echo "lto=${LTO}"
            echo "date_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > build-info.txt

      - name: Stage artifacts
        shell: bash
        env:
          ACK_BRANCH: ${{ matrix.ack_branch }}
        run: |
          set -euo pipefail

          work_root="ack-control/.work/${ACK_BRANCH}"
          test -d "${work_root}"

          rm -rf dist
          mkdir -p dist/images dist/config dist/debug dist/logs dist/metadata

          find "${work_root}" -type f \( \
            -name 'Image' -o \
            -name 'Image.gz' -o \
            -name 'Image.lz4' \
          \) -exec cp -a {} dist/images/ \;

          find "${work_root}" -type f -name '.config' \
            -exec cp -a {} dist/config/ \; || true

          find "${work_root}" -type f \( \
            -name 'System.map' -o \
            -name 'vmlinux' \
          \) -exec cp -a {} dist/debug/ \; || true

          find "${work_root}" -type f -name '*.log' \
            -exec cp -a {} dist/logs/ \; || true

          test "$(find dist/images -type f | wc -l)" -gt 0 || {
            echo "No kernel image found" >&2
            exit 1
          }

          ikconfig_extracted=no
          extract_script="kernel/common/scripts/extract-ikconfig"
          ikconfig_output="dist/config/ikconfig-extracted.config"
          ikconfig_tmp="${ikconfig_output}.tmp"

          rm -f "${ikconfig_output}" "${ikconfig_tmp}"

          if [ -f "${extract_script}" ]; then
            while IFS= read -r image; do
              if bash "${extract_script}" "${image}" > "${ikconfig_tmp}" 2>/dev/null && [ -s "${ikconfig_tmp}" ]; then
                mv "${ikconfig_tmp}" "${ikconfig_output}"
                ikconfig_extracted=yes
                break
              fi
              rm -f "${ikconfig_tmp}"
            done < <(find dist/images -type f | sort)
          fi

          echo "ikconfig_extracted=${ikconfig_extracted}" >> build-info.txt
          install -D -m 0644 build-info.txt dist/metadata/build-info.txt

      - name: Print failure logs
        if: failure()
        shell: bash
        env:
          ACK_BRANCH: ${{ matrix.ack_branch }}
        run: |
          set -euo pipefail

          work_root="ack-control/.work/${ACK_BRANCH}"

          [ -f build-info.txt ] && cat build-info.txt || true

          if [ -d "${work_root}/logs" ]; then
            for log in "${work_root}"/logs/*.log; do
              [ -f "${log}" ] || continue
              echo
              echo "Last 80 lines of ${log##${work_root}/}:"
              tail -n 80 "${log}"
            done
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coreshift-gki-${{ matrix.ack_branch }}
          path: dist/
          if-no-files-found: error
